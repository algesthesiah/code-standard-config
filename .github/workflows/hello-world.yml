name: Hello World

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: |
          echo "Hello World!"
          echo "GitHub Actions is working!"
          echo "Timestamp: $(date)"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
