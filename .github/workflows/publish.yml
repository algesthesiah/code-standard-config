name: Version and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  id-token: write # 必需：允许生成 OIDC id-token，用于 Trusted Publisher
  pull-requests: write

jobs:
  version-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          # 使用 Trusted Publisher，不需要 NPM_TOKEN
          # 确保 scope 配置正确（如果有的话）

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check for changesets
        id: changesets
        run: |
          if [ -n "$(find .changeset -name '*.md' -type f ! -name 'README.md')" ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version packages
        if: steps.changesets.outputs.has_changesets == 'true'
        run: pnpm exec changeset version

      - name: Commit version changes
        if: steps.changesets.outputs.has_changesets == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          # 检查是否有变更需要提交
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: version packages [skip ci]"
            git push
          fi

      - name: Publish to npm
        # changeset publish 会自动检查是否有需要发布的包
        # 如果有 changeset 文件，说明版本已更新，可以发布
        # 如果没有 changeset 文件，说明没有待发布的版本
        run: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不需要 NPM_TOKEN，使用 Trusted Publisher 自动认证
